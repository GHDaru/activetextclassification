# activetextclassification/pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "activetextclassification"
version = "0.0.1"
authors = [
    { name="Gilsiley Henrique Darú", email="ghdaru@gmail.com" },
]
description = "Biblioteca para classificação de texto com aprendizado ativo."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scikit-learn-extra",
    "scipy",
    "unidecode",
    "matplotlib",
    "seaborn",
    "tqdm",
]

[project.optional-dependencies]
llm = [
    "openai",
    "google-generativeai",
    "ollama",
    "anthropic",
    "python-dotenv",
]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["activetextclassification*"]

[project.urls]
"Homepage" = "https://github.com/GHDaru/activetextclassification"
"Bug Tracker" = "https://github.com/GHDaru/activetextclassification/issues"